[package]
name = "acs-bundle"
version.workspace = true
edition.workspace = true
# The zip library needs 1.88; acs-core and acs-engine stay at 1.85 (docs/content.md 2).
rust-version = "1.88"
license.workspace = true
description.workspace = true
publish.workspace = true

[dependencies]
acs-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
png.workspace = true
zip = { version = "9.1", default-features = false, features = ["deflate-flate2"] }
# Pure-Rust deflate, so the crate builds for wasm32.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
