[package]
name = "acs-viewer"
version.workspace = true
edition.workspace = true
# eframe/egui 0.37 need Rust 1.95; acs-core itself stays at the workspace MSRV.
rust-version = "1.95"
license.workspace = true
description.workspace = true
publish.workspace = true

[features]
# Packaged Windows builds: no console window (docs/client.md 8). Local
# builds keep the console for --screenshot and --help output.
windows-gui = []

[[bin]]
name = "acs-viewer"
path = "src/main.rs"

[dependencies]
acs-core.workspace = true
acs-engine.workspace = true
acs-bundle.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
log = "0.4"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
png.workspace = true
cpal = "0.18.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "Node", "HtmlElement", "MediaQueryList", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
cpal = { version = "0.18.2", features = ["wasm-bindgen"] }
js-sys = "0.3"

[lints]
workspace = true
