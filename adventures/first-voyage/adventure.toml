palette = ["black", "brown", "light cyan", "white"]
intro = """
You wake on a warm beach with sand in your boots and no ship in sight.
A harbour town lies to the west, and old sailors say a hollow in the
cliffs to the north hides a chest of coin.

Walk to the town and read the notices: they will show you the way."""

