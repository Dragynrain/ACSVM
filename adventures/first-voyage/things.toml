# First Voyage's own things; the rest come from the pirate kit (content 4.2).

[[thing]]
key = "sea_chant"
name = "SEA CHANT"
type = "magic_spell"
power = 3
spell = { action = "change_life_force", by = 6 }

[[thing]]
key = "dock_notice"
name = "NOTICE"
type = "obstacle"
picture = "scroll"
bump = true
spell = { action = "long_message", message = "dock" }

[[thing]]
key = "store_notice"
name = "NOTICE"
type = "obstacle"
picture = "scroll"
bump = true
spell = { action = "long_message", message = "store" }

[[thing]]
key = "cave_notice"
name = "SCRATCHED WARNING"
type = "obstacle"
