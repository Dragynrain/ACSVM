# The logbook's stack, as under the chest: bumping the book runs the two
# spaces below it, which give the chant and then explain casting it.
[[thing]]
key = "logbook"
name = "OLD LOGBOOK"
type = "obstacle"
picture = "book"
bump = true
spell = { action = "activate_all" }
spell_message = "learned"

[[thing]]
key = "logbook_gift"
name = "OLD LOGBOOK"
type = "space"
picture = "room_roomfloor"
access = { spell = { action = "give", thing = "sea_chant" } }

[[thing]]
key = "logbook_words"
name = "OLD LOGBOOK"
type = "space"
picture = "room_roomfloor"
access = { spell = { action = "long_message", message = "chant" } }

# The success stack under the chest (winning 1.2): stepping onto the
# square once the chest is taken runs the rest. Its top shows sand, so the
# square stands out from the rock floor once the chest is gone.
