# The cliffs: the cave mouth (a fight) and the hollow (a spell, the chest).
# The warning lies a step in from the entrance, between it and the crab;
# the logbook the same in the hollow, between the door and the chest.
# Both caves have a mud floor, so the sandy hollow stands out.

key = "cliffs"
name = "THE CLIFFS"

[[room]]
key = "mouth"
name = "CAVE MOUTH"
at = [0, 0]
wall = "room_caverock"
map = """
#########
#.......#
#.......#
E.n.k...D
#.......#
#.......#
#########
"""

[room.legend]
"#" = "wall"
"." = "mud"
"n" = ["cave_notice", "mud"]
"k" = { creature = "shore_crab", things = ["mud"] }
"E" = { thing = "cave_passage_caverock", to = "map", square = [6, 1] }
"D" = { thing = "cave_passage_caverock", to = "cliffs.hollow" }

[[room]]
key = "hollow"
name = "THE HOLLOW"
at = [8, 0]
wall = "room_caverock"
map = """
#######
#.....#
#.....#
D.b.G.#
#.....#
#.....#
#######
"""

[room.legend]
"#" = "wall"
"." = "mud"
"b" = ["logbook", "logbook_gift", "logbook_words"]
"G" = ["coin_chest", "win_space", "win_theme", "win_words", "win_fanfare"]
"D" = { thing = "cave_passage_caverock", to = "cliffs.mouth" }
