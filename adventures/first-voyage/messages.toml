# First Voyage's messages, numbered in this order (docs/content.md 3.7).

[long]
dock = """WELCOME TO THE DOCK

Move one square at a time with the arrow keys, or click or tap a square
beside you. Walk into a thing to pick it up: try the gold, the cutlass
and the flask on the boards here.

Then ready the cutlass as your weapon, so you can fight with it.

The door in the east wall leads to the trader."""

store = """THE TRADER

Walk into the counter to go inside. The trader's goods sit on shelves:
walk the aisles and into a shelf to see what it holds and its price, and
press Space to buy. Press Space before you move to sell what you carry.
A leather jerkin will turn a blow or two: buy one, walk out through
either door at the sides, then ready it as your armour.

When you are ready, leave the dock by the south gangway and follow the
beach north to the cliffs."""

fight = """THE CAVE MOUTH

Something scuttles in the dark. To fight, walk into a creature with a
weapon ready. Each push is a blow, and a hurt fighter strikes worse.

If you are hurt, drink the rum flask (use it) before you go on."""

chant = """THE OLD LOGBOOK

The last page holds a sea chant, and as you read it the words stay with
you. A spell is used with your Power: cast the chant on yourself to
close your wounds. Power comes back slowly with time.

The chest lies just south of here."""

win = """YOU FOUND THE CHEST OF COIN!

That is the whole of a voyage in small: walking, taking, trading,
fighting and a spell. Every adventure is built from the same few things.

Fair winds to you."""

[short]
learned = "THE SEA CHANT IS YOURS."
