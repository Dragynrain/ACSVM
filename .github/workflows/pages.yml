name: Pages

# Builds the web viewer and publishes target/web to GitHub Pages. The site
# contains only the engine; visitors load their own adventure files locally.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default: the build job runs third-party actions, trunk and
# every dependency's build script, so only the deploy job may publish.
# Actions are pinned by commit hash, the release named beside each.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: trunk
      - run: sh scripts/check-forbidden-files.sh --all
      - run: sh scripts/web.sh build
      - run: sh scripts/check-forbidden-files.sh --dir target/web
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/web/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
